  reboot-it-backend:
    restart: always
    ports:
      - "3001:3001"
    build: ./reboot-it-backend
    env_file:
      - ./reboot-it-backend/.env
    environment:
      PORT: 3001
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: reboot_it
    volumes:
      - reboot-it-uploads:/app/public/uploads
    depends_on:
      - db
    networks:
      - reboot-it-network

volumes:
  reboot-it-mysql:
  reboot-it-uploads: